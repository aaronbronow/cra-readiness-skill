# CRA checklist P2/P7: automated dependency monitoring and update pull requests.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, security]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, security]
