name: CI

# CRA checklist D2: every pull request runs checks that must pass before merge.
# CRA checklist D3: secret scanning (gitleaks) on every change; SAST lives in codeql.yml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.12"] # oldest supported and pinned development version
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Byte-compile the collector
        run: python -m py_compile scripts/collector.py

      - name: Collector runs offline against this checkout
        run: |
          python scripts/collector.py . --format json > evidence.json
          python - <<'PY'
          import json
          d = json.load(open("evidence.json"))
          assert d["total_items"] == 40, f"expected 40 checklist items, got {d.get('total_items')}"
          assert d["assessed_items"] == 40
          assert len(d["item_details"]) == 40
          print("collector OK:", d["grade"], d["stage_breakdowns"])
          PY

      - name: Reference files and templates are complete
        run: |
          set -e
          for f in SKILL.md references/cra_matrix_40.json references/scoring_guide.md \
                   templates/CRA.md templates/SECURITY.md templates/github-actions/cra-ci-sbom.yml \
                   tests/cosign_cra_readiness_report.md; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done
          # SKILL.md frontmatter must declare a name and description
          head -5 SKILL.md | grep -q '^name: ' && head -5 SKILL.md | grep -q '^description: '
          # verify matrix has 40 items across 5 stages
          python - <<'PY'
          import json
          matrix = json.load(open("references/cra_matrix_40.json"))
          items = [item["id"] for stage in matrix["stages"] for item in stage["items"]]
          assert len(items) == 40, f"expected 40 items in matrix, got {len(items)}"
          assert len(matrix["stages"]) == 5, f"expected 5 stages, got {len(matrix['stages'])}"
          print("matrix OK: 40 items across", len(matrix["stages"]), "stages")
          PY
          echo "references and templates OK"

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
