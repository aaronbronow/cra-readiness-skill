name: CI

# CRA checklist D2: every pull request runs checks that must pass before merge.
# CRA checklist D3: secret scanning (gitleaks) on every change; SAST lives in codeql.yml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.12"] # oldest supported and pinned development version
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Byte-compile collectors
        run: |
          python -m py_compile scripts/collect.py
          python -m py_compile scripts/collector.py

      - name: Deterministic 3-tier collector runs offline
        run: |
          python scripts/collector.py . --format json > /tmp/out.json
          python - <<'PY'
          import json
          d = json.load(open("/tmp/out.json"))
          assert d["total_items"] == 40
          assert d["assessed_items"] == 40
          assert "needs_explanation_count" in d
          assert "needs_user_input_count" in d
          print("3-tier collector OK! Grade:", d["grade"])
          PY

      - name: Run automated test suite
        run: python -m unittest discover tests

      - name: Reference files, templates, and action.yml are complete
        run: |
          set -e
          for f in SKILL.md action.yml references/cra_matrix_40.json references/interview_guide.md \
                   templates/CRA.md templates/SECURITY.md templates/github-actions/cra-ci-sbom.yml \
                   templates/github-actions/cra-audit.yml; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done
          # SKILL.md frontmatter must declare a name and description
          head -5 SKILL.md | grep -q '^name: ' && head -5 SKILL.md | grep -q '^description: '
          echo "references and templates OK"

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
