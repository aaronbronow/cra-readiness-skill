name: Release

# CRA checklist R1/R2: SBOM (CycloneDX & SPDX JSON) generated and vulnerability-screened per release.
# SLSA Level 3:        Non-falsifiable provenance via OpenSSF slsa-github-generator.
# CRA checklist D4:    signed build provenance + SHA256 checksums.
# CRA checklist P7:    releases are automated from a tag, so a dependency fix can ship fast.
#
# Trigger: push a tag like v0.1.0.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Package the skill
        run: |
          set -euo pipefail
          name="cra-readiness-skill-${TAG}"
          mkdir -p "dist/${name}"
          cp -r SKILL.md README.md TESTING.md LICENSE SECURITY.md action.yml references scripts templates "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -rf "dist/${name}"
          ls -la dist

      - name: Generate CycloneDX SBOM (Syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/cra-readiness-skill-${{ github.ref_name }}.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SPDX SBOM (Syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/cra-readiness-skill-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Scan Vulnerability Thresholds (Grype --fail-on critical release gate)
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.0.0
        with:
          sbom: dist/cra-readiness-skill-${{ github.ref_name }}.cyclonedx.json
          fail-build: true
          severity-cutoff: medium
          output-format: table

      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.json > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Generate subject hashes for SLSA provenance
        id: hash
        working-directory: dist
        run: |
          set -euo pipefail
          echo "hashes=$(sha256sum *.tar.gz *.json | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  release:
    name: release
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating assets..."
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --generate-notes \
              --notes "Assets: skill tarball, CycloneDX & SPDX SBOMs, SHA256SUMS. SLSA Level 3 provenance attached."
          fi

  provenance:
    name: slsa-provenance
    needs: [build, release]
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true
